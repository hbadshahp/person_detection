<!DOCTYPE html>
<html>
<head>
    <title>Polygon Selector</title>
    <style>
        canvas {
            border: 2px solid black;
            cursor: crosshair;
        }
        body{
             margin:0;
             background:#f4f6f9;
             font-family:Arial;
    }

.header{
    background:white;
    padding:15px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.container{
    padding:20px;
}

canvas{
    border:3px solid #333;
    background:white;
}

.buttons{
    margin-top:15px;
}

button{
    padding:12px 25px;
    font-size:16px;
    margin-right:10px;
    cursor:pointer;
}
    </style>
</head>
<body>

<div class="header">
    <h2>Restricted Area Selection</h2>
    <a href="/">← Back Dashboard</a>
</div>

<div class="container">

    <canvas id="canvas"></canvas>

    <div class="buttons">

        <button onclick="savePolygon()">
            Save Polygon
        </button>

        <button onclick="clearPolygon()">
            Clear
        </button>

    </div>

</div>
<script>

let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

let img = new Image();
img.src = "/snapshot";

let points = [];

img.onload = function(){

    canvas.width = img.width;
    canvas.height = img.height;

    draw();
};

canvas.addEventListener("click",function(e){

    const rect = canvas.getBoundingClientRect();

    points.push([
        Math.round(e.clientX - rect.left),
        Math.round(e.clientY - rect.top)
    ]);

    draw();
});

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.drawImage(
        img,
        0,
        0
    );

    if(points.length>0){

        ctx.beginPath();

        ctx.moveTo(
            points[0][0],
            points[0][1]
        );

        for(let i=1;i<points.length;i++){

            ctx.lineTo(
                points[i][0],
                points[i][1]
            );
        }

        ctx.strokeStyle="red";
        ctx.lineWidth=3;
        ctx.stroke();

        points.forEach(p=>{

            ctx.beginPath();

            ctx.arc(
                p[0],
                p[1],
                5,
                0,
                Math.PI*2
            );

            ctx.fillStyle="blue";
            ctx.fill();

        });
    }
}

function clearPolygon(){

    points=[];

    draw();
}

function savePolygon(){

    if(points.length < 4){

        alert(
            "Minimum 4 points required"
        );

        return;
    }

    let polygonPoints = [...points];

    polygonPoints.push(points[0]);

    fetch('/save_polygon',{

        method:'POST',

        headers:{
            'Content-Type':'application/json'
        },

        body:JSON.stringify({
            polygon:polygonPoints
        })

    })

    .then(r=>r.text())

    .then(msg=>{

        alert(msg);

        window.location.href="/";

    });
}

</script>
</body>
</html>
