<!DOCTYPE html>
<html>

<head>

<title>NG Images History</title>

<style>
.delete-btn{
    background:#dc2626;
    color:white;
    padding:10px 18px;
    border-radius:8px;
    text-decoration:none;
    margin-left:8px;
}

.delete-btn:hover{
    background:#b91c1c;
}

body{
    margin:0;
    background:#eef2f7;
    font-family:'Segoe UI',Arial;
}

.header{
    height:90px;
    background:white;
    display:flex;
    align-items:center;
    padding:0 25px;
    box-shadow:0 2px 12px rgba(0,0,0,.08);
}

.title{
    font-size:30px;
    font-weight:bold;
}

.back{
    margin-left:auto;
    text-decoration:none;
    background:#2563eb;
    color:white;
    padding:12px 20px;
    border-radius:10px;
}

.container{
    padding:20px;
}

.card{
    background:white;
    border-radius:15px;
    padding:20px;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#1f2937;
    color:white;
    padding:15px;
}

td{
    padding:15px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

img{
    width:160px;
    border-radius:8px;
}

.view-btn{
    background:#2563eb;
    color:white;
    padding:8px 15px;
    text-decoration:none;
    border-radius:8px;
}

</style>

</head>

<body>

<div class="header">

    <div class="title">
        NG Images History
    </div>

    <a href="/" class="back">
        Back Dashboard
    </a>

</div>

<div class="container">

<div class="card">

<table>

<tr>
    <th>Time</th>
    <th>Image</th>
    <th>View</th>
</tr>

{% for a in alarms %}

{% if a.image %}

<tr>

<td>
{{ a.time }}
</td>

<td>

<img src="/static/alarm_images/{{a.image}}">

</td>

<td>

<a
class="view-btn"
target="_blank"
href="/static/alarm_images/{{a.image}}">
Open
</a>

{% if role=="admin" %}

<a class="delete-btn"
   href="/delete_image/{{ a.image }}"
   onclick="return confirm('Delete Image ?')">
   Delete
</a>

{% endif %}

</td>

</tr>

{% endif %}

{% endfor %}

</table>

</div>

</div>

</body>

</html>
